[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-weather-pipeline"
version = "0.1.0"
description = "Local Open-Meteo ELT pipeline for a 24-hour Berlin facility weather outlook"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "plotly>=6,<7",
    "tzdata>=2025.2",
]

[project.scripts]
weather-pipeline = "weather_pipeline.cli:main"

[tool.setuptools.package-data]
weather_pipeline = ["berlin.toml"]
