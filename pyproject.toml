[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-meteo-warehouse"
version = "0.2.0"
description = "Configurable Open-Meteo ELT warehouse in DuckDB"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "httpx>=0.28,<1", "tzdata>=2025.2", "pytz>=2025.2"]

[project.optional-dependencies]
analysis = ["fsspec", "numpy", "polars", "pyarrow"]
dev = ["ruff==0.17.5", "vulture==2.16", "coverage==7.17.3"]

[project.scripts]
weather-warehouse = "meteo_warehouse.cli:main"

[tool.setuptools.package-data]
meteo_warehouse = ["*.sql", "*.toml"]

[tool.ruff]
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.vulture]
paths = ["src/meteo_warehouse", "tests"]
min_confidence = 80

[tool.coverage.run]
branch = true
source = ["meteo_warehouse"]
patch = ["subprocess"]
relative_files = true
data_file = "data/quality/coverage/.coverage"

[tool.coverage.report]
precision = 1
show_missing = true
