[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-meteo-warehouse"
version = "0.2.0"
description = "Configurable Open-Meteo ELT warehouse in DuckDB"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "httpx>=0.28,<1", "tzdata>=2025.2", "pytz>=2025.2"]

[project.scripts]
weather-warehouse = "meteo_warehouse.cli:main"

[tool.setuptools.package-data]
meteo_warehouse = ["*.sql", "*.toml"]
